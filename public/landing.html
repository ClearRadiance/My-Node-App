<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kizupi — The Math Tutor That Asks Why</title>
    <link rel="stylesheet" href="/express_style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
</head>

<body>

    <main class="landing-page">

        <!-- Pixel-art sky -->
        <div class="sky">
            <div class="sun"></div>
            <div class="cloud cloud-one"></div>
            <div class="cloud cloud-two"></div>

            <div class="vine vine-one"></div>
            <div class="vine vine-two"></div>
            <div class="vine vine-three"></div>
            <div class="vine vine-four"></div>
            <div class="vine vine-five"></div>
            <div class="vine vine-six"></div>
            <div class="vine vine-seven"></div>
            <div class="vine vine-eight"></div>
            <div class="vine vine-nine"></div>
        </div>

        <!-- Main landing content -->
        <section class="hero">
            <h1>
                Welcome to<br>
                Akira's <span class="highlight">Station</span>.
            </h1>

            <p class="description">
                <br class="desktop-break">

            </p>

            <div class="buttons">
                <a href="/" class="button button-primary">
                    Log In or Sign Up <span class="arrow">↗</span>
                </a>

                <a href="/space" class="button button-secondary">
                    <span class="mini-owl">🦉</span>
                    Check Out the Picture of the Day
                </a>
            </div>

            <p class="pricing">
                A personal space to explore my projects, leave a message, and see what I'm creating.
            </p>
        </section>

        <!-- Pixel-art landscape -->
        <section class="world" aria-label="Animated pixel-art forest">
            <div class="mountains"></div>
            <div class="forest"></div>
            <div class="ground"></div>

            <div class="flower flower-one">✿</div>
            <div class="flower flower-two">✿</div>
            <div class="flower flower-three">✿</div>
            <div class="plant plant-one">♣</div>
            <div class="plant plant-two">♣</div>
            <div class="plant plant-three">♣</div>

            <!-- Frog character -->
            <div class="character frog-character">
                <div class="speech-bubble frog-bubble">High five!</div>
                <div class="frog">
                    <div class="frog-eye frog-eye-left"><i></i></div>
                    <div class="frog-eye frog-eye-right"><i></i></div>
                    <div class="frog-face">
                        <div class="frog-smile"></div>
                    </div>
                </div>
            </div>

            <!-- Owl character -->
            <div class="character owl-character">
                <div class="speech-bubble owl-bubble">Hello there!</div>
                <div class="owl">
                    <div class="owl-ear owl-ear-left"></div>
                    <div class="owl-ear owl-ear-right"></div>
                    <div class="owl-wing owl-wing-left"></div>
                    <div class="owl-wing owl-wing-right"></div>
                    <div class="owl-eye owl-eye-left"><i></i></div>
                    <div class="owl-eye owl-eye-right"><i></i></div>
                    <div class="owl-beak"></div>
                    <div class="owl-belly"></div>
                    <div class="owl-feet"></div>
                </div>
            </div>
        </section>

    </main>
</body>

</html>
